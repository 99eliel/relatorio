name: Simplificar Firebase exclusivo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar colecoes do app
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'relatorio_admins': 'usuarios',
              'relatorio_systems': 'sistemas',
              'relatorio_reports': 'relatorios',
              'relatorio_publicReports': 'relatorios_publicos'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

          rm .github/workflows/firebase-cleanup-once.yml

      - name: Salvar simplificacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/firebase-cleanup-once.yml
          git commit -m "refactor: usa colecoes simples no firebase exclusivo"
          git push
